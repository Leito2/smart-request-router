# Profiles (PLAN.md §7): core | agent | ops   — eval-judge and train run without the streaming stack.
x-core: &core
  profiles: ["core", "agent", "ops"]

services:
  redpanda:
    <<: *core
    image: redpandadata/redpanda:v26.2.7
    command: ["redpanda", "start", "--smp", "1", "--memory", "512M", "--overprovisioned",
              "--node-id", "0", "--check=false",
              "--kafka-addr", "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092",
              "--advertise-kafka-addr", "INTERNAL://redpanda:29092,EXTERNAL://localhost:9092"]
    ports: ["9092:9092"]
    mem_limit: 700m

  redpanda-init:
    <<: *core
    image: redpandadata/redpanda:v26.2.7
    depends_on: [redpanda]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do rpk -X brokers=redpanda:29092 cluster info >/dev/null 2>&1 && break; sleep 2; done
        rpk -X brokers=redpanda:29092 topic create inbound-messages -p 6 || true
        rpk -X brokers=redpanda:29092 topic create routed -p 6 || true
        rpk -X brokers=redpanda:29092 topic create escalations -p 3 || true
        rpk -X brokers=redpanda:29092 topic create alerts -p 1 || true
        rpk -X brokers=redpanda:29092 topic create dlq -p 1 || true
    mem_limit: 100m

  redis:
    <<: *core
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "volatile-lru"]   # only TTL keys (cache) are evicted; queues never (PLAN §3.10)
    ports: ["6379:6379"]
    mem_limit: 150m

  postgres:
    <<: *core
    image: postgres:17
    environment: { POSTGRES_DB: router, POSTGRES_USER: router, POSTGRES_PASSWORD: router }
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["5432:5432"]
    mem_limit: 250m

  llm-gateway:
    profiles: ["agent", "ops"]
    build: ../llm-gateway                   # P0 — shared Python gateway
    env_file: ../llm-gateway/.env.example
    environment: { GW_REDIS_URL: "redis://redis:6379/1" }
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 700m   # semantic cache + guardrails ONNX models (P0 v2)

  minio:
    profiles: ["ops"]
    image: minio/minio:latest               # pin before v1.0
    command: ["server", "/data", "--console-address", ":9001"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    mem_limit: 200m

  minio-init:                               # versioned bucket for datasets and reports
    profiles: ["ops"]
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing local/router-eval
        mc version enable local/router-eval
    mem_limit: 50m

  eval-batch:
    profiles: ["batch"]                     # docker compose --profile batch run --rm eval-batch --router b0
    build: { context: ., dockerfile: Dockerfile.eval }
    depends_on: [minio-init]
    environment: { S3_ENDPOINT: "http://minio:9000", S3_KEY: minioadmin, S3_SECRET: minioadmin }
    mem_limit: 400m

  prometheus:
    profiles: ["ops"]
    image: prom/prometheus:latest           # pin before v1.0
    volumes: ["./observability/prometheus:/etc/prometheus:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]
    mem_limit: 200m

  grafana:
    profiles: ["ops"]
    image: grafana/grafana:latest           # pin before v1.0
    depends_on: [prometheus]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    mem_limit: 150m

  # App services (replayer, dataflow [Quix Streams], system2, dispatcher, api, mocks) arrive in M4–M5.
