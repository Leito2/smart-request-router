[project]
name = "smart-request-router"
version = "0.1.0"
description = "System 1 / System 2 router: Laya decision model on CPU + LangGraph agent, streaming with Quix Streams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["routercore", "judgekit"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
routercore = { workspace = true }
judgekit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["routercore", "judgekit"]

[tool.pytest.ini_options]
testpaths = ["packages/routercore/tests", "packages/judgekit/tests", "tests"]
