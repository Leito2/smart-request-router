[project]
name = "routercore"
version = "0.1.0"
description = "Shared contracts, decision-question definitions and routing policy (dataflow, API, eval)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

[project.optional-dependencies]
http = ["httpx>=0.27"]            # adapters/http_clients.py (P1/P3 clients)
setfit = ["setfit>=1.1"]          # adapters/setfit_model.py (System 1 loaded from models/b1_setfit)
laya = ["laya>=0.4.31"]           # adapters/laya_model.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routercore"]
