[project]
name = "routercore"
version = "0.1.0"
description = "Shared contracts, decision-question definitions and routing policy (dataflow, API, eval)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routercore"]
