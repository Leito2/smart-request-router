[project]
name = "judgekit"
version = "0.1.0"
description = "Async LLM-as-a-Judge evaluation framework: deterministic metrics, judges, calibration, gates (shared by P1-P4)."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Heavy extras arrive by milestone (PLAN §12): runner (aiohttp), reports (pandas), HF metrics, sinks.
runner = ["aiohttp>=3.10"]
report = ["pandas>=2.2", "pyarrow>=17"]
hf = ["evaluate>=0.4", "transformers>=4.45", "rapidfuzz>=3.9"]
sinks = ["mlflow>=2.16", "langfuse>=3", "boto3>=1.35"]

[project.scripts]
judgekit = "judgekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgekit"]
